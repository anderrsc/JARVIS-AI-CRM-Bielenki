services:
  voice:
    build: ./voice
    restart: unless-stopped
    env_file: .env.vps
    environment:
      JARVIS_VOICE_DEVICE: cpu
      VOICE_THREADS: "4"
    volumes:
      - ./voice/model:/app/model:ro
      - ./voice/reference.wav:/app/reference.wav:ro
      - voice_audio:/app/audio-cache
    mem_limit: 2800m
    memswap_limit: 4300m
    cpus: 3.5
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8010/health',headers={'Authorization':'Bearer '+(os.environ.get('JARVIS_VOICE_KEY') or os.environ['JARVIS_USER_KEY'])}),timeout=5)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  voice_audio:
