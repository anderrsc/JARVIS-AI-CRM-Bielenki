services:
  worker:
    build: ./worker
    restart: unless-stopped
    env_file:
      - .env.vps
    environment:
      JARVIS_USER_KEY: ""
      JARVIS_CLOUD_URL: http://jarvis:8000
      JARVIS_INTERNAL_NETWORK: "1"
      JARVIS_WORKER_ID: vps
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:1.5b
      JARVIS_POLL_SECONDS: "5"
    depends_on:
      jarvis:
        condition: service_healthy
      ollama:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 192m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
