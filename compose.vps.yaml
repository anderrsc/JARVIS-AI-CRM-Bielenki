name: jarvis-vps
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    mem_limit: 2500m
    cpus: 3
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "2048"
    volumes:
      - ollama_data:/root/.ollama
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  ollama_data:
